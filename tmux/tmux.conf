set -g prefix C-space
# unbind-key l
bind-key b select-pane -t :.+

################################
################################
################################
# Customization

set-option -g set-titles on

################################
################################
################################
# Key issues
set -g mode-keys vi
set -g mouse on
set-option -sg escape-time 10
################################
################################
################################
# Terminal issues
set -g default-terminal "tmux-256color"

set-option -g focus-events on
# Keep modern terminal capabilities available inside tmux. Foot uses SIXEL for
# images; Kitty-style image clients use tmux passthrough sequences.
set -as terminal-features ',foot:RGB:usstyle:clipboard:sixel'
set -as terminal-features ',xterm-kitty:RGB:usstyle:clipboard'
set -g allow-passthrough on


# To spell errors in nvim
set -as terminal-overrides ',*:Setulc=\E[58::2::::%p1%{65536}%/%d::%p1%{256}%/%{255}%&%d::%p1%{255}%&%d%;m'
set -as terminal-overrides ',*:Smulx=\E[4::%p1%dm'


################################
################################
################################
# List of plugins
set -g @plugin 'tmux-plugins/tpm'

#set -g @plugin 'tmux-plugins/tmux-sensible'

# Clipboard
set -g @plugin 'tmux-plugins/tmux-yank'
set -g @yank_action 'copy-pipe-no-clear'

# Vim like movements
set -g @plugin 'christoomey/vim-tmux-navigator'

# Theme: this fork reads Caelestia's active scheme directly.
set -g @plugin 'alvaro9rqc/tokyo-night-tmux'
set -g @tokyo-night-tmux_theme caelestia
set -g @tokyo-night-tmux_transparent 1
set -g @tokyo-night-tmux_show_git 1

# Resurrect
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @resurrect-capture-pane-contents 'on'
set -g @plugin 'tmux-plugins/tmux-continuum'
set -g @continuum-restore 'on'

# Session manager
set -g @plugin 'vimlinuz/tmux-sm'

run '~/.tmux/plugins/tpm/tpm'



################################
################################
################################
# Layaout
set -g pane-border-status top
set -g pane-border-format "#{@label} | #{pane_title}"
